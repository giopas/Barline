name: pocket

# Barline Pocket (0.18): the web app with no server, published to GitHub
# Pages on every version tag, at https://<owner>.github.io/<repo>/.
# tools/build_pocket.py makes the site from web/static/. Needs the repo's
# Settings > Pages > Source set to "GitHub Actions" (once).
#
# The same site also has the video page (0.21), at .../video/: it plays the
# newest Barline_Pitch.mp4 from the releases (pitch.yml makes it), with the
# slides as a PDF. A repo has one Pages site, so the page can't be published
# on its own without taking Pocket down. pitch.yml starts this workflow on
# the release's tag once the video is attached; until then, the page keeps
# the previous release's video.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # pitch.yml starts it on a release tag; by hand, pick a tag too

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Playwright (the Pocket browser test)
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Merge and Pocket tests
        run: python -m unittest tests.test_merge tests.test_pocket -v
      - name: Build Pocket
        run: python tools/build_pocket.py --out _site
      # After Pocket's build, so the video stays out of Pocket's offline copy.
      - name: The video page (newest release that has the video)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FROM=""
          for TAG in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 15 --json tagName -q '.[].tagName'); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx 'Barline_Pitch.mp4'; then
              FROM="$TAG"; break
            fi
          done
          if [ -z "$FROM" ]; then
            echo "::notice::No release has the video yet: the site goes up without /video/."; exit 0
          fi
          echo "The video and slides of $FROM"
          gh release download "$FROM" --repo "$GITHUB_REPOSITORY" -p 'Barline_Pitch.*' -D _site/video --clobber
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          cp tools/pitch_page.html _site/video/index.html
          cp packaging/icons/icon-256.png _site/video/icon.png
          # The first slide, settled in: the picture the player shows before Play
          # and the one a chat app shows next to the link.
          ffmpeg -loglevel error -y -ss 3 -i _site/video/Barline_Pitch.mp4 -frames:v 1 _site/video/slide-01.png
          ls -la _site/video
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
