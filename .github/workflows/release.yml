name: release

# On a version tag (v0.10.0, ...): build Barline for macOS (Apple silicon and
# Intel), Windows and Linux, check each build starts and serves the web app,
# and attach the downloads + SHA256SUMS to the GitHub Release, with that
# version's CHANGELOG section as the text. Same recipe as QLC+ Swiss Knife.
# Running from source is unchanged.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # a test build from the Actions tab (no release)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x86_64 }
          - { os: windows-latest, label: windows-x64 }
          - { os: ubuntu-22.04,   label: linux-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tk for the control panel (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev
      - name: Install
        run: python -m pip install pyinstaller certifi truststore  # the update check: certifi as a fallback list, truststore for what the computer itself trusts (company networks)
        shell: bash
      - name: Server tests
        # browser tests need Playwright and run in tests.yml; these need nothing.
        # The suite assumes POSIX paths in places, like Swiss Knife's: not on Windows.
        if: runner.os != 'Windows'
        run: python -m unittest tests.test_server tests.test_timing_parity tests.test_quick tests.test_update tests.test_hotspot tests.test_pi_wifi
        shell: bash
      - name: Build
        run: pyinstaller --noconfirm packaging/ssp.spec
        shell: bash
      - name: Smoke test the build
        shell: bash
        run: |
          case "${{ matrix.label }}" in
            macos-*)   EXE="dist/Barline.app/Contents/MacOS/Barline" ;;
            windows-*) EXE="dist/Barline/Barline Server.exe" ;;
            linux-*)   EXE="dist/Barline/Barline" ;;
          esac
          "$EXE" --smoke
      - name: Inno Setup (Windows installer)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
        shell: bash
      - name: Pack
        run: python packaging/make_archive.py
        shell: bash
      - name: Test the Windows installer (silent install, smoke test, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release\*-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'ssp-install'
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir" -Wait
          $p = Start-Process "$dir\Barline Server.exe" -ArgumentList '--smoke' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "smoke test of the installed app failed ($($p.ExitCode))" }
          if (-not (Test-Path "$dir\unins000.exe")) { throw "no uninstaller" }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT' -Wait
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          path: release/*

  publish:
    needs: build
    # publish what was built even if one platform failed, so the others aren't lost
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        run: cd files && sha256sum Barline-* > SHA256SUMS && cat SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="$(python3 tools/release_notes.py "$TAG" --out notes.md)" || { TITLE="$TAG"; echo "See the CHANGELOG." > notes.md; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file notes.md
          fi
          gh release upload "$TAG" files/* --repo "$GITHUB_REPOSITORY" --clobber

  # The pitch video and slide deck, attached once the release exists (pitch.yml),
  # which then republishes the Pocket site with the video page.
  # Separate, so a problem with the video never holds back the downloads.
  pitch:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/pitch.yml
    with:
      tag: ${{ github.ref_name }}
