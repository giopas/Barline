name: tests

on:
  push:
    # a version tag is built and tested by release.yml
    tags-ignore: ["**"]
    paths-ignore: ["**.md", "screenshots/**", "wiki/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "screenshots/**", "wiki/**", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Node (preinstalled on the runner) runs the JS side of the parity tests
      - name: Playwright (browser tests)
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: All tests (server, JS/Python parity, multi-device browser tests)
        run: python -m unittest discover -s tests -v

  # The server on a Mac: every macOS release build up to 0.12.0 hung here (a
  # DNS lookup of the Mac's own .local name), and only a release showed it.
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Server tests on macOS
        run: python -m unittest tests.test_server tests.test_timing_parity tests.test_quick tests.test_update tests.test_hotspot tests.test_pi_wifi -v

  # The Windows half of the band Wi-Fi (server/hotspot.py): its PowerShell
  # parses, and the WinRT types it needs load (no Wi-Fi to start on CI).
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Band Wi-Fi tests on Windows
        run: python -m unittest tests.test_hotspot -v
