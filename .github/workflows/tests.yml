name: tests

on:
  push:
    # a version tag is built and tested by release.yml
    tags-ignore: ["**"]
    paths-ignore: ["**.md", "screenshots/**", "wiki/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "screenshots/**", "wiki/**", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Node (preinstalled on the runner) runs the JS side of the parity tests
      - name: Playwright (browser tests)
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: All tests (server, JS/Python parity, multi-device browser tests)
        run: python -m unittest discover -s tests -v
